<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Love Button">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#1a0b1e">
<title>Love Button</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:-apple-system,system-ui,sans-serif;color:#fff;background:radial-gradient(circle at 50% 20%,#4a1942,#1a0b1e 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:18px}
h1{font-size:22px;font-weight:600;margin:0 0 8px;opacity:.9}
.big{width:200px;height:200px;border-radius:50%;border:none;font-size:80px;background:radial-gradient(circle at 35% 30%,#ff7aa8,#e11d48);box-shadow:0 0 40px #e11d4888;cursor:pointer;transition:transform .15s}
.big:active{transform:scale(.92)}
.big.pulse{animation:p 1.2s ease}
@keyframes p{0%{box-shadow:0 0 0 0 #ff7aa8cc}100%{box-shadow:0 0 0 60px #ff7aa800}}
.lbl{font-size:18px;margin-top:-6px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.sm{border:1px solid #ffffff33;background:#ffffff14;color:#fff;font-size:16px;padding:14px 18px;border-radius:16px;cursor:pointer}
.sm:active{background:#ffffff30}
#st{min-height:24px;font-size:15px;opacity:.85}
</style></head><body>
<h1>💌 For Eyas</h1>
<button class="big" id="b0" onclick="send(0)">❤️</button>
<div class="lbl">I miss you</div>
<div class="row">
<button class="sm" onclick="send(1)">💭 Thinking of you</button>
<button class="sm" onclick="send(2)">📞 Call me</button>
</div>
<div id="st"></div>
<script>
const TOPIC="eyas-love-70e8f0ebc0c8";
const MSG=[["I miss you ❤️","heart"],["Thinking of you 💭","thought_balloon"],["Call me 📞","telephone_receiver"]];
let busy=false;
async function send(i){if(busy)return;busy=true;const st=document.getElementById("st");st.textContent="Sending…";
try{const r=await fetch("https://ntfy.sh/"+TOPIC+"?title="+encodeURIComponent("From your girlfriend 💕")+"&tags="+MSG[i][1]+"&priority=high",{method:"POST",body:MSG[i][0]});
if(!r.ok)throw 0;st.textContent="Sent! 💕";const b=document.getElementById("b0");b.classList.remove("pulse");void b.offsetWidth;b.classList.add("pulse");if(navigator.vibrate)navigator.vibrate(80)}
catch(e){st.textContent="Didn't send, check internet and try again"}
setTimeout(()=>{busy=false},1500);setTimeout(()=>{if(st.textContent.startsWith("Sent"))st.textContent=""},3000)}
</script></body></html>
